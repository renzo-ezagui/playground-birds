<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birds</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      flex-direction: row;
      height: 100vh;
      overflow: hidden;
      background: #111;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    #sidebar {
      width: 220px;
      flex-shrink: 0;
      height: 100vh;
      background: #1a202c;
      color: #e2e8f0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scrollbar-width: thin;
      scrollbar-color: #2d3748 transparent;
    }

    #sidebar h2 {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f6c90e;
      margin-bottom: 12px;
    }

    .group-label {
      font-size: 9px;
      letter-spacing: 0.12em;
      color: #f6c90e;
      text-align: center;
      margin: 14px 0 2px;
      opacity: 0.7;
    }

    .section {
      border-top: 1px solid #2d3748;
      padding: 10px 0 6px;
    }

    .section h3 {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #a0aec0;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .bird-count {
      font-size: 11px;
      color: #a0aec0;
      margin-bottom: 8px;
    }

    button {
      width: 100%;
      padding: 7px 0;
      background: #f6c90e;
      color: #1a202c;
      border: none;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover { background: #ecc94b; }
    button:active { background: #d69e2e; }

    .control { margin-bottom: 6px; }

    .control-top {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #a0aec0;
      margin-bottom: 2px;
    }

    .control-val {
      color: #e2e8f0;
      font-weight: 600;
      min-width: 28px;
      text-align: right;
    }

    input[type=range] {
      width: 100%;
      height: 3px;
      accent-color: #f6c90e;
      cursor: pointer;
    }

    .btn-row {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .class-btn {
      flex: 1;
      padding: 5px 0;
      background: transparent;
      color: #a0aec0;
      border: 1px solid #2d3748;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
    }
    .class-btn:hover { color: #e2e8f0; background: #2d3748; }
    .class-btn.active { background: #2d3748; color: #e2e8f0; }

    .config-panel { margin-bottom: 8px; }

    .add-btn {
      border: 1px solid transparent;
      border-radius: 4px;
    }

    .follow-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: #a0aec0;
      margin-bottom: 6px;
      cursor: pointer;
    }
    .follow-row input { accent-color: #f6c90e; cursor: pointer; }

    #sidebar {
      transition: width 0.22s ease, padding 0.22s ease;
    }
    #sidebar.collapsed {
      width: 0;
      padding: 0;
      overflow: hidden;
    }

    #sidebar-edge {
      flex-shrink: 0;
      width: 14px;
      height: 100vh;
      background: #1a202c;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    #sidebar-toggle {
      width: 14px;
      height: 36px;
      margin-top: 10px;
      padding: 0;
      background: #2d3748;
      border: none;
      border-radius: 0 4px 4px 0;
      color: #f6c90e;
      font-size: 9px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #sidebar-toggle:hover { background: #4a5568; }

    canvas {
      flex: 1;
      display: block;
      background: #f5f0e8;
      cursor: none;
    }

    .section h3 { display: flex; align-items: center; gap: 4px; }

    .info-icon {
      cursor: help;
      color: #4a5568;
      font-size: 10px;
      line-height: 1;
      user-select: none;
      flex-shrink: 0;
    }
    .info-icon:hover { color: #f6c90e; }

    #tooltip {
      position: fixed;
      z-index: 300;
      background: #0d1117;
      border: 1px solid #4a5568;
      color: #cbd5e0;
      font-size: 9px;
      line-height: 1.6;
      padding: 7px 9px;
      border-radius: 4px;
      max-width: 195px;
      pointer-events: none;
      display: none;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }
  </style>
</head>
<body>
  <div id="tooltip"></div>
  <div id="sidebar">
    <h2>Birds</h2>
  </div>
  <div id="sidebar-edge">
    <button id="sidebar-toggle">◀</button>
  </div>
  <canvas id="canvas"></canvas>
  <script src="dist/bundle.js"></script>
</body>
</html>
